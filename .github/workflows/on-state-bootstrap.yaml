name: Bootstrap Terraform state

on:
  push:
    branches:
      - main
    paths:
      - terraform/state-bootstrap/**
      - scripts/bootstrap-state.sh
      - .github/workflows/on-state-bootstrap.yaml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: state-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Bootstrap state infrastructure
        run: ./scripts/bootstrap-state.sh --project-id "$PROJECT_ID" --skip-main-migration