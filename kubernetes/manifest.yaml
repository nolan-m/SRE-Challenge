apiVersion: v1
kind: Namespace
metadata:
  name: nolan-sre
  labels:
    app.kubernetes.io/part-of: nolan-sre
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nolan-sre
  namespace: nolan-sre
  labels:
    app.kubernetes.io/name: nolan-sre
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nolan-sre
  namespace: nolan-sre
  labels:
    app.kubernetes.io/name: nolan-sre
    app.kubernetes.io/part-of: nolan-sre
spec:
  replicas: 3
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nolan-sre
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nolan-sre
        app.kubernetes.io/part-of: nolan-sre
    spec:
      serviceAccountName: nolan-sre
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: REGION-docker.pkg.dev/PROJECT_ID/nolan-sre/nolan-sre:IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - SETGID
                - SETUID
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nolan-sre
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nolan-sre
---
apiVersion: v1
kind: Service
metadata:
  name: nolan-sre
  namespace: nolan-sre
  labels:
    app.kubernetes.io/name: nolan-sre
  annotations:
    # Standalone NEG backing the cross-region Global External LB (terraform/load_balancer.tf).
    cloud.google.com/neg: '{"exposed_ports": {"80":{"name": "nolan-sre-neg"}}}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nolan-sre
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nolan-sre
  namespace: nolan-sre
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nolan-sre
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nolan-sre
  namespace: nolan-sre
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nolan-sre
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress-egress
  namespace: nolan-sre
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-gateway-to-web
  namespace: nolan-sre
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nolan-sre
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: nolan-sre
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nolan-sre
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
